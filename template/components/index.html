<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xiaolab components gallery</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
:root{
  --deck-w:1280;
  --deck-h:720;
  --ink:#1c1b1a;
  --muted:#6c5f58;
  --paper:#ffffff;
  --panel:#fcf7f3;
  --line:rgba(28,27,26,.12);
  --line-strong:rgba(126,86,58,.22);
  --band-top:#fbe5d6;
  --band-bottom:#f8cbad;
  --safe-top:88px;
  --safe-left:84px;
  --safe-right:84px;
  --safe-bottom:82px;
  --gap-xl:34px;
  --gap-lg:24px;
  --gap-md:18px;
  --gap-sm:12px;
}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
canvas.bg{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;pointer-events:none}
#bg-light{opacity:1} #bg-dark{opacity:0}
#deck{position:fixed;inset:0;width:10000vw;height:100vh;display:flex;flex-wrap:nowrap;transition:transform .72s cubic-bezier(.77,0,.175,1);z-index:10;will-change:transform}
.slide{width:100vw;height:100vh;flex:0 0 100vw;position:relative;overflow:hidden;background:#fff}
.stage{position:absolute;left:50%;top:50%;width:calc(var(--deck-w) * 1px);height:calc(var(--deck-h) * 1px);transform:translate(-50%,-50%) scale(var(--stage-scale,1));transform-origin:center center;overflow:hidden;background:var(--paper)}
.top-bar{position:absolute;left:0;top:0;width:1280px;height:64px;background:var(--band-top);z-index:2}
.bottom-band{position:absolute;left:0;bottom:0;width:1280px;height:48px;background:var(--band-bottom);z-index:2}
.hero-band{position:absolute;left:0;top:236px;width:1280px;height:248px;background:var(--band-bottom);z-index:1}
.logo-left-top{position:absolute;left:22px;top:20px;width:175px;height:30px;object-fit:contain;z-index:4}
.logo-top-right{position:absolute;right:34px;top:15px;width:248px;height:34px;object-fit:contain;z-index:4}
.logo-top-right-small{position:absolute;left:816px;top:1px;width:228px;height:68px;object-fit:contain;z-index:4}
.safe-area{position:absolute;left:var(--safe-left);top:var(--safe-top);width:calc(1280px - var(--safe-left) - var(--safe-right));height:calc(720px - var(--safe-top) - var(--safe-bottom));z-index:3}
.hero-centered{position:absolute;left:120px;top:278px;width:1040px;text-align:center;z-index:5}.hero-centered h1{margin:0;font-size:48px;line-height:1.14;font-weight:800;color:#1f1f1f}.hero-centered p{margin:28px 0 0;font-size:24px;line-height:1.4;font-weight:700;color:#3f3f3f}
.section-title{margin:0;font-size:42px;line-height:1.12;font-weight:800}.section-sub{margin:0;font-size:17px;line-height:1.65;color:var(--muted)}
.text-xl{font-size:40px;line-height:1.2;font-weight:800;color:#231d1a}.text-lg{font-size:34px;line-height:1.4;font-weight:800;color:#2d2623}.text-md{font-size:20px;line-height:1.6;color:#3d3430}.text-sm{font-size:16px;line-height:1.6;color:var(--muted)}.tiny{font-size:13px;line-height:1.5;color:#8e7d73;letter-spacing:.08em;text-transform:uppercase}
.stack-xl{display:grid;gap:var(--gap-xl)}.stack-lg{display:grid;gap:var(--gap-lg)}.stack-md{display:grid;gap:var(--gap-md)}.stack-sm{display:grid;gap:var(--gap-sm)}
.top-bottom{display:grid;grid-template-rows:auto 1fr;gap:30px;height:100%}.pair-split{display:grid;grid-template-columns:1fr 1fr;gap:28px;height:100%}.pair-6040{display:grid;grid-template-columns:1.35fr .65fr;gap:28px;height:100%}.pair-4060{display:grid;grid-template-columns:.65fr 1.35fr;gap:28px;height:100%}
.cols-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.cols-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.three-rail{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;align-items:start}.mosaic{display:grid;grid-template-columns:1.12fr .88fr;gap:18px;height:100%}.mosaic-right{display:grid;grid-template-rows:1fr 1fr;gap:18px}.z-lanes{display:grid;grid-template-columns:1fr 1fr;gap:34px;position:relative}.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;align-items:start}.decision-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:26px;height:100%}.metric-ribbon{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:end}.evidence-band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;height:100%}
.slot{position:relative;min-height:88px}.slot::before{content:'';position:absolute;inset:0;border:1px dashed rgba(126,86,58,.22);border-radius:18px}.slot.soft::before{border-style:solid;border-color:rgba(126,86,58,.12);background:linear-gradient(180deg,rgba(252,247,243,.9),rgba(255,255,255,.25))}.slot.tall{min-height:320px}.slot.mid{min-height:220px}.slot.short{min-height:120px}.slot.flat{min-height:80px}.slot.clean::before{border-radius:0;border-top:1px solid var(--line-strong);border-right:0;border-left:0;border-bottom:0;background:none}
.line-top{padding-top:14px;border-top:1px solid var(--line-strong)}.line-bottom{padding-bottom:14px;border-bottom:1px solid var(--line)}.divider{height:1px;background:var(--line)}.micro-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.micro-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}.pill{display:inline-flex;align-items:center;height:28px;padding:0 10px;border:1px solid rgba(126,86,58,.18);border-radius:999px;color:#8a604c;font-size:13px}.number-mark{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#9a7a69}
.chrome{position:absolute;right:34px;bottom:10px;display:flex;justify-content:flex-end;align-items:center;font-size:13px;color:#7d6b61;z-index:5}.chrome .page{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;background:rgba(255,255,255,.78);border:1px solid rgba(126,86,58,.16);padding:6px 10px;border-radius:999px}
#nav{display:none}.notes{display:none}
@media print{html,body{background:#fff} canvas.bg,#nav{display:none !important} #deck{position:static;width:auto;height:auto;display:block;transform:none !important} .slide{width:auto;height:auto;page-break-after:always} .stage{position:relative;left:auto;top:auto;transform:none !important;margin:0 auto}}
</style>

<div id="overview" style="display:none;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);padding:32px;box-sizing:border-box;overflow:auto;"></div>
<script>
(function(){
  const slides=[...document.querySelectorAll('#deck .slide')];
  const deck=document.getElementById('deck');
  const overview=document.getElementById('overview');
  const total=slides.length; let idx=0, lock=false, overviewOn=false, tx=0, ty=0, wheelTO=null, wheelAcc=0;
  deck.style.width=(total*100)+'vw';
  function fit(){ const scale=Math.min((window.innerWidth-8)/1280,(window.innerHeight-8)/720) || 1; document.documentElement.style.setProperty('--stage-scale', String(scale)); }
  function buildOverview(){ overview.innerHTML=''; const grid=document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;'; slides.forEach((s,i)=>{ const c=document.createElement('button'); c.style.cssText='border:0;background:#fff;padding:16px;border-radius:20px;cursor:pointer;text-align:left;color:#1f1f1f;box-shadow:0 10px 30px rgba(0,0,0,.12);'; const title=s.dataset.title||''; const h=s.querySelector('h1,h2,h3'); const lead=(h?.textContent||'').trim(); c.innerHTML=`<div style="font:700 14px/1.4 Inter, sans-serif;color:#a16a4c;">第 ${i+1} 页</div><div style="margin-top:8px;font:800 24px/1.18 Inter, sans-serif;">${title}</div>${lead && lead!==title ? `<div style="margin-top:10px;font:700 16px/1.45 Inter, sans-serif;color:#2e2825;">${lead}</div>` : ''}`; c.onclick=()=>{overview.style.display='none';overviewOn=false;go(i)}; grid.appendChild(c); }); overview.appendChild(grid); }
  function render(){ deck.style.transform=`translateX(${-idx*100}vw)`; slides.forEach((s,i)=>{ const page=s.querySelector('.chrome .page'); if(page) page.textContent=`${String(i+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}`; }); }
  function go(n){ if(lock) return; idx=Math.max(0,Math.min(total-1,n)); lock=true; render(); history.replaceState(null,'','#/'+(idx+1)); setTimeout(()=>lock=false,650); }
  function fromHash(){ const m=/^#\/(\d+)/.exec(location.hash||''); return m?Math.max(0,Math.min(total-1, parseInt(m[1],10)-1)):0; }
  addEventListener('hashchange',()=>{ idx=fromHash(); render(); }); addEventListener('resize', fit);
  addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.preventDefault(); overviewOn=!overviewOn; if(overviewOn){ buildOverview(); overview.style.display='block'; } else overview.style.display='none'; return; } if(overviewOn) return; if(['ArrowRight','PageDown',' ','ArrowDown'].includes(e.key)){ e.preventDefault(); go(idx+1); } if(['ArrowLeft','PageUp','ArrowUp'].includes(e.key)){ e.preventDefault(); go(idx-1); } if(e.key==='Home') go(0); if(e.key==='End') go(total-1); if(e.key==='f' || e.key==='F'){ e.preventDefault(); if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); } });
